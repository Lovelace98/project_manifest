<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Blueprint DNA Operations Hub</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/static/css/index.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #F8FAFC;
            padding: 1.5rem;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            text-align: center;
        }

        .login-logo {
            max-width: 260px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 0.4rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: #64748B;
            margin-bottom: 1.75rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group .input-lead-icon {
            position: absolute;
            left: 1rem;
            color: #94A3B8;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 2.75rem 0.75rem 2.6rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: #0F172A;
            background: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: transparent;
            border: none;
            padding: 0.4rem;
            color: #94A3B8;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: color 0.15s ease;
        }

        .password-toggle-btn:hover {
            color: #0284C7;
        }

        .password-toggle-btn:focus-visible {
            outline: 2px solid #0284C7;
            outline-offset: 1px;
        }

        .input-group input:focus {
            outline: none;
            background: #FFFFFF;
            border-color: #0284C7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: #FFFFFF;
            background: #0284C7;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: #0369A1;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .error-alert {
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #DC2626;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-align: left;
        }

        .login-footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #94A3B8;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <img src="/brand/logo" alt="Blueprint DNA Organization" class="login-logo">
            <h1 class="login-title">Operations Hub</h1>
            <p class="login-subtitle">Sign in to access Manifest Portal &amp; Report Bot</p>

            {% if error %}
            <div class="error-alert">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
                <input type="hidden" name="next" value="{{ next_url or '/' }}">

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-group">
                        <i class="fa-solid fa-user input-lead-icon"></i>
                        <input type="text" id="username" name="username" placeholder="admin" value="admin" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-lead-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                        <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Show password" title="Show password">
                            <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
                </button>
            </form>

            <div class="login-footer">
                &copy; 2026 Blueprint DNA Organization. Secured Internal Workspace.
            </div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-password-icon');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
                const label = isPassword ? 'Hide password' : 'Show password';
                toggleBtn.setAttribute('aria-label', label);
                toggleBtn.setAttribute('title', label);
            });
        }
    </script>
</body>
</html>
